<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 460" role="img" aria-labelledby="title desc">
  <title id="title">Carte géographique de la Côte d'Ivoire</title>
  <desc id="desc">Carte simplifiée de la Côte d'Ivoire avec ses principales villes dont Abidjan, Yamoussoukro, Bouaké, San-Pédro et Korhogo.</desc>
  <defs>
    <linearGradient id="land" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6a50"/>
      <stop offset="100%" stop-color="#2f8a66"/>
    </linearGradient>
    <linearGradient id="sea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dff3ff"/>
      <stop offset="100%" stop-color="#bfe6fb"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0b2e22" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="420" height="460" fill="url(#sea)" rx="24"/>
  <path d="M0 360 C60 350, 120 345, 170 350 C230 356, 290 352, 350 346 C380 343, 400 340, 420 338 L420 460 L0 460 Z" fill="#a9dbf5" opacity="0.55"/>
  <g filter="url(#shadow)">
    <path d="M78 352
      C95 358, 118 362, 148 360
      C172 358, 188 362, 205 366
      C228 371, 252 368, 272 360
      C292 352, 305 344, 314 332
      C318 318, 322 300, 326 276
      C331 246, 336 214, 342 182
      C348 148, 352 116, 346 86
      C340 60, 322 44, 294 36
      C262 28, 226 26, 190 30
      C154 34, 122 42, 96 56
      C74 68, 60 86, 52 112
      C44 142, 40 176, 40 210
      C40 244, 44 278, 54 308
      C62 330, 70 344, 78 352 Z"
      fill="url(#land)" stroke="#f3fff8" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <g stroke="#e9fff4" stroke-opacity="0.35" stroke-width="1.5" fill="none">
    <path d="M70 150 C120 160, 170 150, 220 165 C260 178, 300 170, 335 160"/>
    <path d="M55 230 C110 240, 170 235, 230 245 C275 252, 305 250, 330 245"/>
    <path d="M150 55 C165 120, 175 190, 185 260 C195 310, 200 335, 205 365"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g fill="#ffffff" font-size="11" font-weight="700" opacity="0.95">
      <text x="250" y="58">MALI</text>
      <text x="332" y="120">BURKINA</text>
      <text x="332" y="134">FASO</text>
      <text x="345" y="250">GHANA</text>
      <text x="18" y="120">GUINÉE</text>
      <text x="10" y="285">LIBERIA</text>
      <text x="150" y="430" fill="#1f5f86" font-size="13">Golfe de Guinée</text>
    </g>

    <g>
      <circle cx="236" cy="366" r="7" fill="#e9b95f" stroke="#ffffff" stroke-width="2"/>
      <text x="246" y="362" font-size="13" font-weight="700" fill="#143d2e">Abidjan</text>
      <text x="246" y="376" font-size="10" fill="#1f4a3a">(Babi)</text>
    </g>
    <g>
      <circle cx="210" cy="250" r="6.5" fill="#ffffff" stroke="#123f32" stroke-width="2"/>
      <text x="220" y="246" font-size="12.5" font-weight="700" fill="#143d2e">Yamoussoukro</text>
      <text x="220" y="260" font-size="10" fill="#1f4a3a">Capitale politique</text>
    </g>
    <g>
      <circle cx="246" cy="175" r="5.5" fill="#ffd9a3" stroke="#ffffff" stroke-width="2"/>
      <text x="256" y="179" font-size="12" font-weight="700" fill="#143d2e">Bouaké</text>
    </g>
    <g>
      <circle cx="235" cy="95" r="5" fill="#ffd9a3" stroke="#ffffff" stroke-width="2"/>
      <text x="244" y="99" font-size="11.5" font-weight="700" fill="#143d2e">Korhogo</text>
    </g>
    <g>
      <circle cx="120" cy="360" r="5" fill="#ffd9a3" stroke="#ffffff" stroke-width="2"/>
      <text x="42" y="356" font-size="11.5" font-weight="700" fill="#143d2e">San-Pédro</text>
    </g>
    <g>
      <circle cx="120" cy="210" r="4.5" fill="#ffd9a3" stroke="#ffffff" stroke-width="2"/>
      <text x="78" y="206" font-size="11" font-weight="700" fill="#143d2e">Man</text>
    </g>
    <g>
      <circle cx="165" cy="265" r="4.5" fill="#ffd9a3" stroke="#ffffff" stroke-width="2"/>
      <text x="108" y="270" font-size="11" font-weight="700" fill="#143d2e">Daloa</text>
    </g>
    <g>
      <circle cx="285" cy="275" r="4.5" fill="#ffd9a3" stroke="#ffffff" stroke-width="2"/>
      <text x="295" y="279" font-size="11" font-weight="700" fill="#143d2e">Abengourou</text>
    </g>
    <g>
      <circle cx="180" cy="320" r="4.5" fill="#ffd9a3" stroke="#ffffff" stroke-width="2"/>
      <text x="122" y="332" font-size="11" font-weight="700" fill="#143d2e">Gagnoa</text>
    </g>
  </g>
  <g transform="translate(20,20)">
    <rect width="150" height="54" rx="12" fill="#ffffff" fill-opacity="0.9"/>
    <text x="12" y="22" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#123f32">Côte d'Ivoire</text>
    <text x="12" y="40" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.5" fill="#3e5a4f">Afrique de l'Ouest</text>
  </g>
</svg>